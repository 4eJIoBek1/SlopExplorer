name: Build and Deploy

on:
  push:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Scrape data
        if: github.event_name != 'push'
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
        run: node tools/scrape-data.js

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/2kki/data.json
          git diff --cached --quiet || git commit -m "Update data via scrape [skip ci]"
          git push

      - name: Compile bundle
        run: npm run compile

      - name: Assemble dist
        run: |
          mkdir -p _dist
          cp -r public/* _dist/
          cp index.html location.html _dist/
          touch _dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _dist
      - uses: actions/deploy-pages@v4
